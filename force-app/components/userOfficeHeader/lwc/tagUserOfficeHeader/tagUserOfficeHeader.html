<template>
    <div class="slds-var-p-top_medium slds-var-p-bottom_small slds-var-p-vertical_small">
        <div class="slds-grid slds-align-center slds-align-spread">
            <div class="slds-grid slds-align-center">
                <!-- User icon -->
                <template if:true={isUser}>
                    <lightning-icon icon-name="standard:user" size="medium"></lightning-icon>
                </template>

                <!-- Nav office icon -->
                <template if:true={isNavOffice}>
                    <lightning-icon icon-name="custom:custom61" size="medium"></lightning-icon>
                </template>

                <!-- Nav region icon -->
                <template if:true={isNavRegion}>
                    <lightning-icon icon-name="custom:custom61" size="medium"></lightning-icon>
                </template>

                <!-- Heading -->
                <template if:false={isHidden}>
                    <h1>
                        <template if:true={showNavUnitLink}>
                            <a
                                title={headerText}
                                href={navUnitUrl}
                                onclick={handleNavUnitClick}
                                class="slds-text-link_reset"
                                ><span class="slds-text-heading_medium slds-m-left_small slds-text-link_faux"
                                    ><strong>{headerText}</strong></span
                                ></a
                            >
                        </template>
                        <template if:false={showNavUnitLink}>
                            <span class="slds-text-heading_medium slds-m-left_small"
                                ><strong>{headerText}</strong></span
                            >
                        </template>
                    </h1>
                </template>

                <template if:true={isHidden}>
                    <h1 style="visibility: hidden" class="slds-text-heading_medium slds-m-left_small">placeholder</h1>
                </template>
            </div>
        </div>
    </div>
</template>
